  admin-script-tests:
    name: Admin Script Tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          # PHP renders the page markup and script settings the tests load.
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Setup Node.js 24
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install npm dependencies
        id: install_npm_dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ls jsdom

      - name: Run admin script tests
        id: run_admin_script_tests
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          node --version
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/sse-diagnostics/admin-script-tests.tap" \
            "tests/js/**/*.test.mjs"
          # A run that found no tests must not pass.
          grep -Eq '^# pass [1-9]' "$RUNNER_TEMP/sse-diagnostics/admin-script-tests.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/sse-diagnostics/admin-script-tests.tap"
          # This control must fail because of its assertion.
          printf '%s\n' \
            "import assert from 'node:assert/strict';" \
            "import { test } from 'node:test';" \
            "test( 'intentional failure', () => assert.equal( 1, 2, 'Admin script intentional assertion control' ) );" \
            > "$RUNNER_TEMP/sse-intentional-failure.test.mjs"
          if node --test "$RUNNER_TEMP/sse-intentional-failure.test.mjs" > "$RUNNER_TEMP/sse-intentional-failure.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          fi
          grep -q 'Admin script intentional assertion control' "$RUNNER_TEMP/sse-intentional-failure.txt"
          echo 'Intentional-assertion control failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            setup_node=${{ steps.setup_node.outcome }}
            install_npm_dependencies=${{ steps.install_npm_dependencies.outcome }}
            run_admin_script_tests=${{ steps.run_admin_script_tests.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/sse-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/sse-diagnostics/run.txt"
          if command -v node >/dev/null; then
            node --version > "$RUNNER_TEMP/sse-diagnostics/node.txt"
          fi
          if command -v npm >/dev/null && [ -d node_modules ]; then
            npm ls --all --depth=1 > "$RUNNER_TEMP/sse-diagnostics/dependencies.txt" 2>&1 || true
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/sse-diagnostics" -type l -delete
          find "$RUNNER_TEMP/sse-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-admin-script-tests
          path: |
            ${{ runner.temp }}/sse-diagnostics/run.txt
            ${{ runner.temp }}/sse-diagnostics/steps.txt
            ${{ runner.temp }}/sse-diagnostics/node.txt
            ${{ runner.temp }}/sse-diagnostics/dependencies.txt
            ${{ runner.temp }}/sse-diagnostics/admin-script-tests.tap
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on admin script test failure
        id: create_issue_on_admin_script_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.setup_node.outcome == 'failure' && 'setup_node' || steps.install_npm_dependencies.outcome == 'failure' && 'install_npm_dependencies' || steps.run_admin_script_tests.outcome == 'failure' && 'run_admin_script_tests' || 'unknown_or_canceled' }}
          NODE_VERSION: '24'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/admin-script-test-failure.md
          update_existing: false

