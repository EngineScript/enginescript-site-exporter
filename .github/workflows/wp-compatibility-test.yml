              public function test_deactivation_and_uninstall_leave_nothing_behind() {
                  $export_paths = sse_setup_export_directories();
                  $this->assertIsArray($export_paths);
                  $base = sse_get_export_directory_path();
                  $zip = $export_paths['export_dir'] . '/site_enginescript_site_export_20260513_123456.zip';
                  $this->assertSame(7, file_put_contents($zip, 'fixture'));
                  $this->assertIsArray(sse_acquire_export_lease());
                  delete_option('sse_error_logs');
                  sse_store_log_in_database('kept until the plugin is deleted', 'error');
                  foreach (sse_get_scheduled_hook_names() as $hook) {
                      $this->assertTrue(wp_schedule_single_event(time() + 600, $hook, [$zip]));
                  }
                  $this->assertCount(4, array_unique($this->sse_get_scheduled_plugin_hooks()));

                  sse_deactivate_plugin();

                  clearstatcache();
                  $this->assertFileDoesNotExist($zip);
                  $this->assertDirectoryDoesNotExist($export_paths['export_dir']);
                  $this->assertNull(sse_get_stored_export_lease());
                  $this->assertSame([], $this->sse_get_scheduled_plugin_hooks());
                  // The records stay until the plugin is deleted.
                  $this->assertCount(1, get_option('sse_error_logs'));

                  sse_uninstall_plugin();

                  clearstatcache();
                  $this->assertFalse(get_option('sse_error_logs'));
                  $this->assertDirectoryDoesNotExist($base);
              }

              public function test_tree_deletion_does_not_follow_links() {
                  $root = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $base = $root . '/base';
                  $tree = $base . '/export-fixture';
                  $this->assertTrue(mkdir($tree . '/nested', 0700, true));
                  $this->assertTrue(mkdir($root . '/outside', 0700));
                  try {
                      $this->assertSame(4, file_put_contents($root . '/outside/keep.txt', 'keep'));
                      $this->assertSame(4, file_put_contents($tree . '/nested/gone.txt', 'gone'));
                      $this->assertTrue(symlink($root . '/outside', $tree . '/directory-link'));
                      $this->assertTrue(symlink($root . '/outside/keep.txt', $tree . '/nested/file-link'));
                      $this->assertTrue(symlink($root . '/outside', $base . '/linked-tree'));
                      $this->assertTrue(symlink($root . '/outside', $root . '/outside-link'));
                      // A path outside the base is refused, also when it is written through the base.
                      $this->assertFalse(sse_delete_directory_tree($root . '/outside', $base));
                      $this->assertFalse(sse_delete_directory_tree($base . '/../outside', $base));
                      // A link outside the base is left in place.
                      $this->assertFalse(sse_delete_directory_tree($root . '/outside-link', $base));
                      $this->assertTrue(is_link($root . '/outside-link'));
                      $this->assertTrue(sse_delete_directory_tree($tree, $base));
                      // A link in place of the directory is removed as a link.
                      $this->assertTrue(sse_delete_directory_tree($base . '/linked-tree', $base));
                      clearstatcache();
                      $this->assertDirectoryDoesNotExist($tree);
                      $this->assertFalse(is_link($base . '/linked-tree'));
                      $this->assertSame('keep', file_get_contents($root . '/outside/keep.txt'));
                  } finally {
                      $this->sse_remove_fixture_tree($root);
                  }
              }

              public function test_export_base_is_refused_inside_web_served_directories() {
                  $had_root = array_key_exists('DOCUMENT_ROOT', $_SERVER);
                  $previous_root = $_SERVER['DOCUMENT_ROOT'] ?? null;
                  $root = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $upload_dir = wp_get_upload_dir();
                  $this->assertTrue(wp_mkdir_p($upload_dir['basedir']));
                  $this->assertTrue(mkdir($root . '/public/inner', 0700, true));
                  $this->assertTrue(mkdir($root . '/private', 0700));
                  try {
                      $this->assertTrue(symlink($root . '/public/inner', $root . '/private/alias'));
                      $_SERVER['DOCUMENT_ROOT'] = $root . '/public';
                      $served = [ABSPATH . 'wp-admin', WP_CONTENT_DIR, $upload_dir['basedir'],
                          $root . '/public', $root . '/public/inner', $root . '/private/alias'];
                      foreach ($served as $path) {
                          $this->assertTrue(sse_is_path_web_served($path), $path);
                      }
                      $this->assertFalse(sse_is_path_web_served($root . '/private'));
                      // An empty document root, or the filesystem root, says nothing about what is served.
                      foreach (['', '/'] as $ignored_root) {
                          $_SERVER['DOCUMENT_ROOT'] = $ignored_root;
                          $this->assertFalse(sse_is_path_web_served($root . '/public'));
                      }
                      $_SERVER['DOCUMENT_ROOT'] = untrailingslashit(get_temp_dir());
                      $refused = sse_setup_export_directories();
                      $this->assertWPError($refused);
                      $this->assertSame('export_dir_public', $refused->get_error_code());
                  } finally {
                      if ($had_root) {
                          $_SERVER['DOCUMENT_ROOT'] = $previous_root;
                      } else {
                          unset($_SERVER['DOCUMENT_ROOT']);
                      }
                      $this->sse_remove_fixture_tree($root);
                  }
              }

