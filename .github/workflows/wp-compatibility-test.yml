              public function test_files_archive_walk_contents_and_single_pass() {
                  $fixture = 'sse-walk-' . wp_generate_uuid4();
                  $source = ABSPATH . $fixture;
                  $out = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $long_name = str_repeat('p', 150) . '.txt';
                  $utf8_name = "\u{00FC}n\u{00EF}-\u{2713}.txt";
                  $export_paths = null;
                  $lease = sse_acquire_export_lease();
                  $this->assertIsArray($lease);
                  sse_set_current_export_lease($lease);
                  sse_initialize_export_resource_budget(0);
                  try {
                      foreach (['/kept', '/.git', '/locked'] as $directory) {
                          $this->assertTrue(mkdir($source . $directory, 0755, true));
                      }
                      $files = [
                          '/0' => 'zero',
                          '/empty.txt' => '',
                          '/kept/' . $long_name => str_repeat('y', 700),
                          '/' . $utf8_name => 'not ASCII',
                          '/.git/config' => 'left out',
                          '/.htaccess' => 'left out',
                          '/locked/inside.txt' => 'left out',
                      ];
                      foreach ($files as $name => $content) {
                          $this->assertSame(strlen($content), file_put_contents($source . $name, $content));
                      }
                      $this->assertTrue(symlink($source . '/0', $source . '/link'));
                      $this->assertTrue(chmod($source . '/locked', 0000));

                      $export_paths = sse_setup_export_directories();
                      $this->assertIsArray($export_paths);
                      $archive = $export_paths['export_dir'] . '/files.tar.gz';
                      $this->assertTrue(sse_create_wordpress_files_archive($archive));
                      $this->assertSame(0600, fileperms($archive) & 0777);
                      $skipped = sse_get_skipped_export_entry_counts();
                      $this->assertSame(1, $skipped['links']);
                      $this->assertSame(1, $skipped['unreadable']);
                      $this->assertSame(0, $skipped['large'] + $skipped['special'] + $skipped['changed']);

                      exec(
                          'tar --list --verbose --gzip --quoting-style=literal --file ' . escapeshellarg($archive) . ' 2>&1',
                          $listing,
                          $status
                      );
                      $this->assertSame(0, $status, implode("\n", array_slice($listing, -5)));
                      $names = [];
                      $tar_bytes = strlen(sse_tar_get_end_of_archive());
                      $file_bytes = 0;
                      foreach ($listing as $line) {
                          $this->assertSame(1, preg_match('/^.{10}\s+\S+\s+(\d+)\s+\S+\s+\S+\s(.+)$/', $line, $match), $line);
                          $names[] = $match[2];
                          $file_bytes += (int) $match[1];
                          $tar_bytes += sse_tar_get_entry_bytes((int) $match[1], $match[2]);
                      }
                      $this->assertGreaterThan(1000, count($names));
                      $this->assertSame(count($names), count(array_unique($names)));

                      // Single pass: every entry is counted once, and the stream holds one
                      // header and one copy of the content per entry and nothing else.
                      $budget = sse_get_export_resource_budget();
                      $this->assertSame(count($names), $budget['entries']);
                      $this->assertSame($file_bytes, $budget['source_bytes']);
                      $stream = gzopen($archive, 'rb');
                      $this->assertNotFalse($stream);
                      $stream_bytes = 0;
                      while (!gzeof($stream)) {
                          $stream_bytes += strlen((string) gzread($stream, 1048576));
                      }
                      gzclose($stream);
                      $this->assertSame($tar_bytes, $stream_bytes);

                      $prefix = $fixture . '/';
                      $expected = [$prefix, $prefix . '0', $prefix . 'empty.txt', $prefix . 'kept/',
                          $prefix . 'kept/' . $long_name, $prefix . $utf8_name];
                      $archived = array_values(array_filter($names, static function ($name) use ($prefix) {
                          return str_starts_with($name, $prefix);
                      }));
                      sort($expected);
                      sort($archived);
                      $this->assertSame($expected, $archived);

                      $this->assertTrue(mkdir($out, 0700));
                      exec(
                          'tar --extract --gzip --file ' . escapeshellarg($archive) . ' --directory ' . escapeshellarg($out)
                          . ' ' . escapeshellarg($fixture) . ' 2>&1',
                          $messages,
                          $status
                      );
                      $this->assertSame(0, $status, implode("\n", $messages));
                      foreach (['/0', '/empty.txt', '/kept/' . $long_name, '/' . $utf8_name] as $name) {
                          $this->assertSame($files[$name], file_get_contents($out . '/' . $fixture . $name));
                      }
                  } finally {
                      $this->sse_remove_fixture_tree($source);
                      $this->sse_remove_fixture_tree($out);
                      if (is_array($export_paths)) {
                          sse_delete_directory_tree($export_paths['export_dir']);
                      }
                      sse_release_export_lease(sse_get_current_export_lease() ?? $lease);
                  }
              }

              public function test_per_file_size_limit_travels_with_the_request() {
                  $user_id = $this->sse_sign_in_exporter();
                  // An earlier version kept the limit in this transient; it no longer has any effect.
                  set_transient('sse_export_max_file_size_' . $user_id, 1, HOUR_IN_SECONDS);
                  $this->assertSame(0, sse_get_export_max_file_size());
