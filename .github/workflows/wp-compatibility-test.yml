              public function test_export_request_is_refused_without_action_nonce_or_capability() {
                  delete_option('sse_error_logs');
                  // A request that is not the export form is ignored.
                  $this->assertFalse(sse_validate_export_request());
                  $_POST = ['action' => 'another_action'];
                  $this->assertFalse(sse_validate_export_request());

                  $_POST = ['action' => 'sse_export_site'];
                  $this->sse_assert_refused('sse_validate_export_request');
                  $_REQUEST['sse_export_nonce'] = 'invalid';
                  $this->sse_assert_refused('sse_validate_export_request');

                  wp_set_current_user(self::factory()->user->create(['role' => 'subscriber']));
                  $_REQUEST['sse_export_nonce'] = wp_create_nonce('sse_export_action');
                  $this->sse_assert_refused('sse_validate_export_request', 'You do not have permission to perform this action.');
                  $this->assertSame([], get_option('sse_error_logs', []));

                  $this->sse_sign_in_exporter();
                  $_REQUEST['sse_export_nonce'] = wp_create_nonce('sse_export_action');
                  $this->assertSame(0, sse_validate_export_request());
                  // Only a size that the form offers is accepted; anything else means no limit.
                  $sizes = ['104857600' => 104857600, '524288000' => 524288000, '1073741824' => 1073741824,
                      '0' => 0, '12345' => 0, '-1' => 0, '1e9' => 0, ' 104857600' => 104857600];
                  foreach ($sizes as $posted => $accepted) {
                      $_POST['sse_max_file_size'] = (string) $posted;
                      $this->assertSame($accepted, sse_validate_export_request(), (string) $posted);
                  }
                  $_POST['sse_max_file_size'] = ['104857600'];
                  $this->assertSame(0, sse_validate_export_request());
              }

              public function test_download_and_delete_requests_are_refused_before_any_file_access() {
                  delete_option('sse_error_logs');
                  $file = 'site_enginescript_site_export_20260513_123456.zip';
                  $directory = sse_generate_private_export_directory_name();
                  $download_action = 'sse_secure_download_' . $file . '_' . $directory;
                  $delete_action = 'sse_delete_export_' . $file . '_' . $directory;
                  $request = ['file' => $file, 'export_dir' => $directory];

                  // The download reads the query string and the deletion reads the form body, and nothing else.
                  $this->sse_assert_refused('sse_handle_secure_download', 'Invalid download request.');
                  $this->sse_assert_refused('sse_handle_export_deletion', 'Invalid deletion request.');
                  $_POST = $request;
                  $this->sse_assert_refused('sse_handle_secure_download', 'Invalid download request.');
                  $_POST = [];
                  $_GET = $request;
                  $this->sse_assert_refused('sse_handle_export_deletion', 'Invalid deletion request.');

                  $_POST = $request;
                  foreach ([null, 'invalid'] as $nonce) {
                      if (null !== $nonce) {
                          $_REQUEST['_wpnonce'] = $nonce;
                      }
                      $this->sse_assert_refused('sse_handle_secure_download');
                      $this->sse_assert_refused('sse_handle_export_deletion');
                  }

                  wp_set_current_user(self::factory()->user->create(['role' => 'subscriber']));
                  $_REQUEST['_wpnonce'] = wp_create_nonce($download_action);
                  $this->sse_assert_refused('sse_handle_secure_download', 'You do not have permission to download export files.');
                  $_REQUEST['_wpnonce'] = wp_create_nonce($delete_action);
                  $this->sse_assert_refused('sse_handle_export_deletion', 'You do not have permission to delete export files.');
                  // A refusal before or at the authorization checks stores no record.
                  $this->assertSame([], get_option('sse_error_logs', []));

                  $this->sse_sign_in_exporter();
                  // The nonce of one action does not authorize the other.
                  $_REQUEST['_wpnonce'] = wp_create_nonce($download_action);
                  $this->sse_assert_refused('sse_handle_export_deletion');
                  $this->assertSame([], get_option('sse_error_logs', []));
                  $this->sse_assert_refused('sse_handle_secure_download', 'This export has expired or was deleted.');
                  $_REQUEST['_wpnonce'] = wp_create_nonce($delete_action);
                  $this->sse_assert_refused('sse_handle_export_deletion', 'This export has expired or was deleted.');
                  $records = get_option('sse_error_logs');
                  $this->assertSame(['activity', 'activity'], wp_list_pluck($records, 'level'));
                  $this->assertStringStartsWith('Export download refused:', $records[0]['message']);
                  $this->assertStringStartsWith('Export deletion refused:', $records[1]['message']);
              }

              public function test_activity_and_error_records() {
                  $user_id = $this->sse_sign_in_exporter();
                  $failure = "Same failure\nforged line in " . SSE_EXPORT_PRIVATE_DIR_PREFIX . '20260513_123456-' . str_repeat('a', 32);
                  // A record written by an earlier version carries a client address.
                  update_option('sse_error_logs', [[
                      'time' => time(), 'level' => 'error', 'message' => 'from an earlier version',
                      'user_id' => 0, 'ip' => '203.0.113.7',
                  ]], false);
                  sse_record_activity('Export created: site.zip');
                  sse_record_activity('Export created: site.zip');
                  sse_log($failure, 'error');
                  sse_log($failure, 'error');
                  sse_log('Not stored', 'info');
                  sse_log('Not stored', 'warning');
                  $records = get_option('sse_error_logs');
                  // Activity is always stored; an identical error is stored once per hour.
                  $this->assertSame(['error', 'activity', 'activity', 'error'], wp_list_pluck($records, 'level'));
                  foreach ($records as $record) {
                      $this->assertSame(['time', 'level', 'message', 'user_id'], array_keys($record));
                  }
                  $this->assertSame($user_id, $records[1]['user_id']);
                  // The line break and the random directory name do not reach the record.
                  $this->assertSame('Same failure forged line in ' . SSE_EXPORT_PRIVATE_DIR_PREFIX . '[private]', $records[3]['message']);
                  $records[3]['time'] -= HOUR_IN_SECONDS;
                  update_option('sse_error_logs', $records, false);
                  sse_log($failure, 'error');
                  $this->assertCount(5, get_option('sse_error_logs'));
              }
          }
          EOF

      - name: Create PHPUnit Config
        id: create_phpunit_config
        run: |
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0"?>
          <phpunit
              bootstrap="tests/bootstrap.php"
              backupGlobals="false"
              colors="true"
              failOnEmptyTestSuite="true"
              failOnRisky="true"
              failOnWarning="true"
          >
              <testsuites>
                  <testsuite name="EngineScript Site Exporter">
                      <directory suffix="Test.php">./tests/integration/</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          EOF

      - name: Setup WP Tests
        id: setup_wp_tests
        timeout-minutes: 15
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp-version }} true

      - name: Run plugin test
        id: run_plugin_test
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/sse-diagnostics/junit.xml"
          # Prove that the real generated config rejects an empty filtered suite.
          if vendor/bin/phpunit --config phpunit.xml --do-not-cache-result \
            --filter '__sse_intentionally_no_matching_test__' \
            > "$RUNNER_TEMP/sse-empty-suite.txt" 2>&1; then
            echo '::error::An empty test suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/sse-empty-suite.txt"
          fi
          # This control must fail due to its assertion, not a setup/parse error.
          cat > "$RUNNER_TEMP/SseIntentionalFailureTest.php" << 'EOF'
          <?php
          final class SseIntentionalFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'SSE intentional assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result \
            "$RUNNER_TEMP/SseIntentionalFailureTest.php" \
            > "$RUNNER_TEMP/sse-failing-suite.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'SSE intentional assertion control' "$RUNNER_TEMP/sse-failing-suite.txt"
          fi
          echo 'Empty-suite and intentional-assertion controls failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            use_isolated_composer_auth=${{ steps.use_isolated_composer_auth.outcome }}
            php_syntax_lint=${{ steps.php_syntax_lint.outcome }}
            install_subversion=${{ steps.install_subversion.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_unit_tests=${{ steps.run_unit_tests.outcome }}
            pin_phpunit_for_wordpress_test_suite=${{ steps.pin_phpunit_for_wordpress_test_suite.outcome }}
            verify_phpunit_dependency_versions=${{ steps.verify_phpunit_dependency_versions.outcome }}
            prepare_database=${{ steps.prepare_database.outcome }}
            create_tests_directory_structure=${{ steps.create_tests_directory_structure.outcome }}
            create_wp_tests_install_script=${{ steps.create_wp_tests_install_script.outcome }}
            create_bootstrap_file=${{ steps.create_bootstrap_file.outcome }}
            create_test_file=${{ steps.create_test_file.outcome }}
            create_phpunit_config=${{ steps.create_phpunit_config.outcome }}
            setup_wp_tests=${{ steps.setup_wp_tests.outcome }}
            run_plugin_test=${{ steps.run_plugin_test.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/sse-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/sse-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/sse-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/sse-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/sse-diagnostics" -type l -delete
          find "$RUNNER_TEMP/sse-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.dependency-versions }}
          path: |
            ${{ runner.temp }}/sse-diagnostics/run.txt
            ${{ runner.temp }}/sse-diagnostics/steps.txt
            ${{ runner.temp }}/sse-diagnostics/php.txt
            ${{ runner.temp }}/sse-diagnostics/dependencies.txt
            ${{ runner.temp }}/sse-diagnostics/wordpress.txt
            ${{ runner.temp }}/sse-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report test status
        id: report_test_status
        if: ${{ always() }}
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tests passed successfully on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          else
            echo "❌ Tests failed on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          fi

      - name: Ensure repository files available after failure
        id: ensure_repository_files_available_after_failure
        if: ${{ failure() }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create issue on test failure
        id: create_issue_on_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.use_isolated_composer_auth.outcome == 'failure' && 'use_isolated_composer_auth' || steps.php_syntax_lint.outcome == 'failure' && 'php_syntax_lint' || steps.install_subversion.outcome == 'failure' && 'install_subversion' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_unit_tests.outcome == 'failure' && 'run_unit_tests' || steps.pin_phpunit_for_wordpress_test_suite.outcome == 'failure' && 'pin_phpunit_for_wordpress_test_suite' || steps.verify_phpunit_dependency_versions.outcome == 'failure' && 'verify_phpunit_dependency_versions' || steps.prepare_database.outcome == 'failure' && 'prepare_database' || steps.create_tests_directory_structure.outcome == 'failure' && 'create_tests_directory_structure' || steps.create_wp_tests_install_script.outcome == 'failure' && 'create_wp_tests_install_script' || steps.create_bootstrap_file.outcome == 'failure' && 'create_bootstrap_file' || steps.create_test_file.outcome == 'failure' && 'create_test_file' || steps.create_phpunit_config.outcome == 'failure' && 'create_phpunit_config' || steps.setup_wp_tests.outcome == 'failure' && 'setup_wp_tests' || steps.run_plugin_test.outcome == 'failure' && 'run_plugin_test' || steps.report_test_status.outcome == 'failure' && 'report_test_status' || steps.ensure_repository_files_available_after_failure.outcome == 'failure' && 'ensure_repository_files_available_after_failure' || 'unknown_or_canceled' }}
          PHP_VERSION: ${{ matrix.php-version }}
          WP_VERSION: ${{ matrix.wp-version }}
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/wp-version-test-failure.md
          update_existing: false
