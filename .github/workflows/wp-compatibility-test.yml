              public function test_lease_recovers_from_unusable_rows() {
                  foreach ([null, 'not serialized', 'O:8:"stdClass":0:{}', serialize(['owner' => 'incomplete'])] as $row) {
                      $this->assertNull(sse_decode_export_lease_row($row));
                  }
                  delete_option('sse_error_logs');

                  // A row that fails validation cannot belong to a running export, so it is removed.
                  $this->assertTrue(sse_add_export_lease_option(['owner' => 'incomplete']));
                  $invalid = sse_get_stored_export_lease();
                  $this->assertWPError($invalid);
                  $this->assertSame('export_lease_invalid', $invalid->get_error_code());
                  $lease = sse_acquire_export_lease();
                  $this->assertIsArray($lease);
                  $this->assertSame($lease, sse_get_stored_export_lease());
                  $records = get_option('sse_error_logs');
                  $this->assertCount(1, $records);
                  $this->assertSame('security', $records[0]['level']);
                  $this->assertTrue(sse_release_export_lease($lease));

                  // A valid lease that has expired is reclaimed.
                  $expired = $lease;
                  $expired['owner'] = wp_generate_uuid4();
                  $expired['started_at'] = time() - 7200;
                  $expired['heartbeat_at'] = time() - 7200;
                  $expired['expires_at'] = time() - 1;
                  $this->assertTrue(sse_add_export_lease_option($expired));
                  $this->assertSame($expired, sse_get_stored_export_lease());
                  $next = sse_acquire_export_lease();
                  $this->assertIsArray($next);
                  $this->assertNotSame($expired['owner'], $next['owner']);
                  $this->assertTrue(sse_release_export_lease($next));
                  $this->assertNull(sse_get_stored_export_lease());
              }

              public function test_lease_renewal_never_moves_the_heartbeat_backward() {
                  $lease = sse_acquire_export_lease();
                  $this->assertIsArray($lease);
                  try {
                      // The stored heartbeat is ahead of the clock, as after a backward clock step.
                      $ahead = $lease;
                      $ahead['heartbeat_at'] = time() + 600;
                      $ahead['expires_at'] = $ahead['heartbeat_at'] + 30;
                      $this->assertTrue(sse_compare_and_update_export_lease($lease, $ahead));
                      sse_set_current_export_lease($ahead);
                      $this->assertTrue(sse_renew_current_export_lease(true));
                      $renewed = sse_get_current_export_lease();
                      $this->assertSame($ahead['heartbeat_at'], $renewed['heartbeat_at']);
                      $this->assertSame($ahead['heartbeat_at'] + sse_get_export_lease_lifetime(), $renewed['expires_at']);
                      $this->assertSame($renewed, sse_get_stored_export_lease());
                  } finally {
                      sse_release_export_lease(sse_get_current_export_lease() ?? $lease);
                  }
              }

