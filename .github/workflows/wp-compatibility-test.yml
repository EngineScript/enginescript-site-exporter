              /**
               * Signs in a user who may export on this kind of installation.
               */
              private function sse_sign_in_exporter() {
                  $user_id = self::factory()->user->create(['role' => 'administrator']);
                  if (is_multisite()) {
                      grant_super_admin($user_id);
                  }
                  wp_set_current_user($user_id);
                  return $user_id;
              }

              /**
               * Requires that a request handler stops through wp_die().
               */
              private function sse_assert_refused(callable $request, $expected_message = '') {
                  try {
                      $request();
                  } catch (WPDieException $refusal) {
                      $this->assertStringContainsString($expected_message, $refusal->getMessage());
                      return;
                  }
                  $this->fail('The request was not refused.');
              }

              /**
               * Removes a fixture tree without following links.
               */
              private function sse_remove_fixture_tree($path) {
                  if (is_link($path) || is_file($path)) {
                      unlink($path);
                      return;
                  }
                  if (!is_dir($path)) {
                      return;
                  }
                  chmod($path, 0700);
                  foreach (array_diff(scandir($path), ['.', '..']) as $entry) {
                      $this->sse_remove_fixture_tree($path . '/' . $entry);
                  }
                  rmdir($path);
              }

              /**
               * Lists every scheduled event that belongs to the plugin.
               */
              private function sse_get_scheduled_plugin_hooks() {
                  $hooks = [];
                  foreach ((array) _get_cron_array() as $events) {
                      foreach (array_keys((array) $events) as $hook) {
                          if (str_starts_with((string) $hook, 'sse_')) {
                              $hooks[] = (string) $hook;
                          }
                      }
                  }
                  return $hooks;
              }

              public function test_tar_header_layout_and_checksum() {
                  $header = sse_tar_build_header('dir/file.txt', 5, 0104755, 1700000000, '0');
                  $this->assertSame(512, strlen($header));
                  $this->assertSame('dir/file.txt', rtrim(substr($header, 0, 100), "\0"));
                  // Only the nine permission bits are stored, and the owner and group are zero.
                  $this->assertSame("0000755\0", substr($header, 100, 8));
                  $this->assertSame("0000000\0", substr($header, 108, 8));
                  $this->assertSame("0000000\0", substr($header, 116, 8));
                  $this->assertSame("00000000005\0", substr($header, 124, 12));
                  $this->assertSame(sprintf("%011o\0", 1700000000), substr($header, 136, 12));
                  $this->assertSame('0', $header[156]);
                  $this->assertSame("ustar  \0", substr($header, 257, 8));
                  $checksum = array_sum(unpack('C*', substr_replace($header, '        ', 148, 8)));
                  $this->assertSame(sprintf("%06o\0 ", $checksum), substr($header, 148, 8));
              }

              public function test_tar_size_field_padding_and_entry_lengths() {
                  $this->assertSame("77777777777\0", sse_tar_format_size_field(077777777777));
                  // From 8 GiB on, the size is stored in the GNU binary form.
                  $this->assertSame("\x80\0\0\0" . pack('J', 8589934592), sse_tar_format_size_field(8589934592));
                  $this->assertSame(12, strlen(sse_tar_format_size_field(PHP_INT_MAX)));
                  $this->assertSame('', sse_tar_get_padding(0));
                  $this->assertSame(511, strlen(sse_tar_get_padding(1)));
                  $this->assertSame('', sse_tar_get_padding(1024));
                  $this->assertSame(str_repeat("\0", 1024), sse_tar_get_end_of_archive());
                  // A path of up to 100 bytes needs one header; a longer one needs a long-name record first.
                  foreach ([100 => 512, 101 => 1536, 300 => 1536, 600 => 2048] as $length => $expected) {
                      $path = str_repeat('n', $length);
                      $this->assertSame($expected, strlen(sse_tar_build_entry_header($path, 0, 0644, 0, '0')));
                      $this->assertSame($expected, sse_tar_get_entry_bytes(0, $path));
                  }
                  $this->assertSame(512 + 1024, sse_tar_get_entry_bytes(513, 'f'));
                  $long_name = sse_tar_build_long_name_record(str_repeat('n', 101));
                  $this->assertSame('L', $long_name[156]);
                  $this->assertSame('././@LongLink', rtrim(substr($long_name, 0, 100), "\0"));
              }

              public function test_tar_output_is_read_by_gnu_tar() {
                  $root = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $entries = [
                      'd/' => null,
                      'd/empty.txt' => '',
                      str_repeat('e', 100) => 'exactly one hundred bytes',
                      'd/' . str_repeat('m', 99) => 'one byte over',
                      'd/' . str_repeat('L', 120) . '/' . str_repeat('L', 170) . '.txt' => str_repeat('x', 513),
                      "d/\u{00FC}n\u{00EF}-\u{2713}.txt" => 'not ASCII',
                  ];
                  $archive = '';
                  foreach ($entries as $name => $content) {
                      if (null === $content) {
                          $archive .= sse_tar_build_entry_header($name, 0, 0755, 1700000000, '5');
                          continue;
                      }
                      $archive .= sse_tar_build_entry_header($name, strlen($content), 0640, 1700000000, '0')
                          . $content . sse_tar_get_padding(strlen($content));
                  }
                  $archive .= sse_tar_get_end_of_archive();
                  $this->assertTrue(mkdir($root . '/out', 0700, true));
                  try {
                      $this->assertSame(strlen($archive), file_put_contents($root . '/fixture.tar', $archive));
                      exec(
                          'tar --extract --preserve-permissions --file ' . escapeshellarg($root . '/fixture.tar')
                          . ' --directory ' . escapeshellarg($root . '/out') . ' 2>&1',
                          $output,
                          $status
                      );
                      $this->assertSame(0, $status, implode("\n", $output));
                      $this->assertSame([], $output);
                      foreach ($entries as $name => $content) {
                          if (null === $content) {
                              $this->assertDirectoryExists($root . '/out/' . $name);
                              continue;
                          }
                          $this->assertSame($content, file_get_contents($root . '/out/' . $name));
                      }
                      $this->assertSame(0640, fileperms($root . '/out/d/empty.txt') & 0777);
                      $this->assertSame(1700000000, filemtime($root . '/out/d/empty.txt'));
                  } finally {
                      $this->sse_remove_fixture_tree($root);
                  }
              }

