---
# Codacy configuration.
#
# TSLint is deprecated and is switched off for this repository in Codacy, yet
# Codacy still ran it. It is turned off from here in two ways: tslint.json
# enables no rule, and the paths below keep every file away from the tool.
# The two JSON files are named as well, because they are what it flagged: it
# asked for trailing commas and sorted keys, which JSON and npm's lock file
# cannot have. Every other tool still reads every file.
engines:
  tslint:
    exclude_paths:
      - "**"
      - "**/*"
      - "package.json"
      - "package-lock.json"
