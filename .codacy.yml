---
# Codacy configuration
#
# With each tool's "Configuration file" setting on, Codacy reads phpcs.xml, phpmd.xml,
# eslint.config.mjs, .stylelintrc.json, .markdownlint.json, biome.json, .pylintrc, and bandit.yml.
# Codacy installs no WordPress standards or packages, so those files hold only what it can run; CI
# runs the full configurations (phpcs-wordpress.xml, phpmd.xml with phpmd-extra.xml,
# eslint.wordpress.config.mjs, stylelint-wordpress.json) and the same Biome, Pylint, and Bandit
# files. See CONTRIBUTING.md.

engines:
  # Lizard reads the lock files as source code and reports their length.
  # Composer and npm generate them; nobody writes them by hand.
  lizard:
    exclude_paths:
      - "composer.lock"
      - "package-lock.json"
      - "**/composer.lock"
      - "**/package-lock.json"
